<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>Sticky Notes</h1>
    <button id="export" class="ghost" title="Download a backup of all notes">Export</button>
  </header>

  <button id="add" class="primary">+ New note on this page</button>
  <p id="msg" class="msg" hidden></p>

  <input id="search" type="search" placeholder="Search all notes…" />

  <div id="list"></div>

  <footer>
    <span id="count">0 notes</span>
    <span>Shortcut: Alt+Shift+N</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
